<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=/client">
    <title>AE Renewable Ltd | Clean Energy Engineering</title>
    <link rel="icon" type="image/png" href="/CLI_Folder/client/logo.png">
    <script>
        if (window.location.pathname === "/" || window.location.pathname === "/index.html") {
            window.location.replace("/client");
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #010a1d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(244, 166, 0, 0.2);
            border-top-color: #f4a600;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
        p { color: #94a3b8; font-size: 0.9rem; }
        a { color: #f4a600; text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h1>AE Renewable Ltd</h1>
    <p>Redirecting to client portal... <a href="/client">Click here if not redirected</a></p>
</body>
</html>
